version: '3'

# drmon Linux port — build/run/debug tasks. Everything runs in throwaway
# containers spun from a cached toolchain image (nothing installed on the host). See
# devsys/tools/drmon/linux/README.md and docs/plans/2026-06-10-port-drmon-linux.md.
# Phase 2: MAME TCP bridge backend — docs/plans/2026-06-11-drmon-mame-backend.md.
# Use SYS=snes (default) or SYS=gen to select the debugger target.

# Shared tasks from the python-tui-lib library (md preview, memory-viz, old-todos, …).
# flatten: true exposes them unprefixed (`task md -- file.md`); never copy them in.
includes:
  shared:
    taskfile: ../python-tui-lib/Taskfile.shared.yml
    optional: true
    flatten: true

vars:
  IMAGE: drmon-build
  DRMON: devsys/tools/drmon
  BUILD: /tmp/drmon-build
  # AddressSanitizer runtime opts (build is ASan by default, -DDRMON_ASAN=ON). Log to a
  # file under the mounted build dir (host: /tmp/drmon-build/asan.<pid>) so reports never
  # corrupt the TUI; keep running after a non-fatal hit; skip leak-at-exit noise.
  ASAN: 'log_path=/build/asan:halt_on_error=0:detect_leaks=0:abort_on_error=0'
  # common container invocation: repo at /src, build tree at /build, cwd = drmon dir
  DOCKER: docker run --rm -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -e ASAN_OPTIONS={{.ASAN}} -w /src/{{.DRMON}} {{.IMAGE}}
  # SYS selects the target: snes (65816) or gen (68000).  Default: snes.
  SYS: '{{default "snes" .SYS}}'
  BIN: '{{if eq .SYS "gen"}}genmon{{else}}snesmon{{end}}'
  # SNES bridge address (mame_bridge.lua TCP listener, port 41816).
  DRMON_MAME_ADDR: '{{default "127.0.0.1:41816" .DRMON_MAME_ADDR}}'
  # Genesis GDB RSP address (MAME -debugger gdbstub, port 23946).
  DRMON_GDB_ADDR: '{{default "127.0.0.1:23946" .DRMON_GDB_ADDR}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task -l
    silent: true

  image:
    desc: Build the toolchain Docker image (g++/cmake/ninja/ncurses/gdb/tmux) — built once and cached; run/debug/shot spin throwaway containers from it
    cmds:
      - docker build -t {{.IMAGE}} {{.DRMON}}/linux

  build:
    desc: Compile + link both snesmon and genmon in the container
    deps: [image]
    cmds:
      - '{{.DOCKER}} bash -euc "cmake -S . -B /build -G Ninja && ninja -C /build"'
      - '{{.DOCKER}} bash -euc "file /build/snesmon && file /build/genmon"'

  run:
    desc: "Run drmon in a terminal (SYS=snes|gen; needs TTY ≥ 80×25). With MAME: set DRMON_MAME_ADDR if not on localhost:41816. Windows ▸ New Window needs X: run 'xhost +local:' once on the host."
    deps: [build]
    cmds:
      # Allow the container to reach the host X server (best-effort) so Windows ▸ New Window
      # can open a terminal on the host display. Harmless if xhost/X aren't present.
      - "xhost +local: >/dev/null 2>&1 || true"
      # -e DISPLAY + the X11 socket carry the display into the container.
      # DRMON_TERMINAL (optional) overrides the spawned terminal; else x-terminal-emulator/xterm in the image.
      - docker run --rm -it --network=host -e DISPLAY -v /tmp/.X11-unix:/tmp/.X11-unix -e DRMON_TERMINAL -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /build -e TERM=xterm-256color -e ASAN_OPTIONS={{.ASAN}} -e DRMON_MAME_ADDR={{.DRMON_MAME_ADDR}} -e DRMON_GDB_ADDR={{.DRMON_GDB_ADDR}} {{.IMAGE}} ./{{.BIN}}

  mame:
    desc: "Launch MAME with the drmon bridge (SYS=snes|gen, CART=<rom path>). SNES uses Lua bridge on :41816; Genesis uses native gdbstub on :23946."
    cmds:
      - |
        set -euo pipefail
        LUA="{{.ROOT_DIR}}/{{.DRMON}}/linux/mame_bridge.lua"
        DRIVER="{{if eq .SYS "gen"}}genesis{{else}}snes{{end}}"
        CART="{{.CART}}"
        if [ -z "$CART" ]; then echo "Usage: task mame SYS=snes|gen CART=<rom>"; exit 1; fi
        if [ "{{.SYS}}" = "gen" ]; then
          PORT="${DRMON_GDB_ADDR##*:}"; PORT="${PORT:-23946}"
          mame "$DRIVER" -cart "$CART" -debug -debugger gdbstub -debugger_port "$PORT" -window
        else
          mame "$DRIVER" -cart "$CART" -debug -debugger none -autoboot_script "$LUA" -window
        fi

  test-bridge:
    desc: "Run the full bridge test suite (SYS=snes|gen). Launches MAME on the host, runs test_bridge.py, tears down on exit."
    cmds:
      - 'bash {{.ROOT_DIR}}/{{.DRMON}}/linux/test_bridge.sh {{.SYS}}'

  debug:
    desc: "Run drmon under gdb and print a backtrace for crash diagnosis (SYS=snes|gen)"
    deps: [build]
    cmds:
      - docker run --rm --network=host -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /build -e ASAN_OPTIONS={{.ASAN}} -e DRMON_MAME_ADDR={{.DRMON_MAME_ADDR}} {{.IMAGE}} gdb -q -batch -ex run -ex bt ./{{.BIN}}

  tui-shot:
    desc: "Headless TUI text-dump — launch drmon in tmux and capture pane (SYS=snes|gen)"
    deps: [build]
    cmds:
      - >-
        docker run --rm -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /build -e ASAN_OPTIONS={{.ASAN}} {{.IMAGE}}
        bash -euc '
          export TERM=xterm-256color;
          tmux new-session -d -s d -x 80 -y 25;
          tmux send-keys -t d "./{{.BIN}} 2>/dev/null" Enter;
          sleep 1.5;
          tmux capture-pane -t d -p;
          tmux kill-server 2>/dev/null || true'

  screenshots:
    desc: Capture a PNG screenshot of every window type into devsys/tools/drmon/docs/img/
    deps: [build]
    cmds:
      - mkdir -p /tmp/drmon-shots {{.ROOT_DIR}}/{{.DRMON}}/docs/img
      - >-
        docker run --rm
        -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -v /tmp/drmon-shots:/shots
        -w /build -e ASAN_OPTIONS={{.ASAN}} {{.IMAGE}}
        bash -euc '
          export TERM=xterm-256color; SESSION=drmon-shots;
          sendalt() { printf "\033%s" "$1" | tmux load-buffer -; tmux paste-buffer -t "$SESSION"; };
          sendraw() { printf "$1"        | tmux load-buffer -; tmux paste-buffer -t "$SESSION"; };
          cap1() { local n="$1" k="$2";
            tmux kill-session -t "$SESSION" 2>/dev/null || true;
            tmux new-session -d -s "$SESSION" -x 80 -y 25;
            tmux send-keys -t "$SESSION" "./snesmon 2>/dev/null" Enter; sleep 1.8;
            [ -n "$k" ] && { sendalt "$k"; sleep 0.6; };
            tmux capture-pane -t "$SESSION" -p -e > "/shots/${n}.ansi";
            tmux kill-session -t "$SESSION" 2>/dev/null || true; };
          capmem() { local n="$1" ctrl="$2";
            tmux kill-session -t "$SESSION" 2>/dev/null || true;
            tmux new-session -d -s "$SESSION" -x 80 -y 25;
            tmux send-keys -t "$SESSION" "./snesmon 2>/dev/null" Enter; sleep 1.8;
            sendalt m; sleep 0.5;
            sendraw "$ctrl"; sleep 0.3;
            tmux capture-pane -t "$SESSION" -p -e > "/shots/${n}.ansi";
            tmux kill-session -t "$SESSION" 2>/dev/null || true; };
          cap1 desktop  "";
          cap1 memory   m; cap1 register  r; cap1 spc_register n; cap1 breakpoint b;
          cap1 watch    w; cap1 symbol    s; cap1 expression e;
          cap1 command  k; cap1 source    l; cap1 textview   t;
          cap1 console  o; cap1 ascii     y;
          cap1 projectinfo i; cap1 about a;
          capmem memory_bytes  "\002";
          capmem memory_words  "\027";
          capmem memory_long   "\014";
          capmem memory_disasm "\004";
          capmem memory_ascii  "\031"'
      - |
        for f in /tmp/drmon-shots/*.ansi; do
          n=$(basename "$f" .ansi)
          python3 {{.ROOT_DIR}}/{{.DRMON}}/linux/render_ansi.py "$f" "{{.ROOT_DIR}}/{{.DRMON}}/docs/img/${n}.png" 2
        done

  smoke:
    desc: "Smoke test — open each window via Alt-key; fail on any crash (SYS=snes|gen)"
    deps: [build]
    cmds:
      - '{{.DOCKER}} bash linux/smoke-test.sh /build/{{.BIN}}'

  signals:
    desc: "Signal test — Ctrl+C ignored; fatal signal restores terminal (SYS=snes|gen)"
    deps: [build]
    cmds:
      - '{{.DOCKER}} bash linux/signal-test.sh /build/{{.BIN}}'

  overflow:
    desc: "Regression test — ASan catches DOS 8.3 filename/path buffer overflows (no ROM/TTY needed)"
    deps: [image]
    cmds:
      - '{{.DOCKER}} bash linux/overflow-test.sh'

  test-symbols:
    desc: "Symbol-loader tests — symfmt parser self-test (ca65/WLA) + DAP loaders (.dbg/.sym/.sld/COFF). No MAME/TTY."
    deps: [build]
    cmds:
      # Unit: shared symfmt parser (labels, source lines, content-sniff fall-through).
      - '{{.DOCKER}} bash -euc "g++ -std=gnu++98 -Wall -Wextra -o /build/symfmt_selftest symfmt_selftest.cpp symfmt.cpp && /build/symfmt_selftest"'
      # Integration: the DAP SymbolTable loaders end-to-end over stdin/stdout.
      - '{{.DOCKER}} bash -euc "DRMON_DAP_SNES=/build/drmon-dap-snes python3 linux/dap/test_symbols.py"'

  clean:
    desc: Remove the build tree
    cmds:
      - rm -rf {{.BUILD}}

  rebuild:
    desc: Clean then build from scratch
    cmds:
      - task: clean
      - task: build
