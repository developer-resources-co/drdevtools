version: '3'

# drmon Linux port — build/run/debug tasks. Everything runs in throwaway
# containers spun from a cached toolchain image (nothing installed on the host). See
# devsys/tools/drmon/linux/README.md and docs/plans/2026-06-10-port-drmon-linux.md.

# Shared tasks from the python-tui-lib library (md preview, memory-viz, old-todos, …).
# flatten: true exposes them unprefixed (`task md -- file.md`); never copy them in.
includes:
  shared:
    taskfile: ../python-tui-lib/Taskfile.shared.yml
    optional: true
    flatten: true

vars:
  IMAGE: drmon-build
  DRMON: devsys/tools/drmon
  BUILD: /tmp/drmon-build
  # AddressSanitizer runtime opts (build is ASan by default, -DDRMON_ASAN=ON). Log to a
  # file under the mounted build dir (host: /tmp/drmon-build/asan.<pid>) so reports never
  # corrupt the TUI; keep running after a non-fatal hit; skip leak-at-exit noise.
  ASAN: 'log_path=/build/asan:halt_on_error=0:detect_leaks=0:abort_on_error=0'
  # common container invocation: repo at /src, build tree at /build, cwd = drmon dir
  DOCKER: docker run --rm -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -e ASAN_OPTIONS={{.ASAN}} -w /src/{{.DRMON}} {{.IMAGE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task -l
    silent: true

  image:
    desc: Build the toolchain Docker image (g++/cmake/ninja/ncurses/gdb/tmux) — built once and cached; run/debug/shot spin throwaway containers from it
    cmds:
      - docker build -t {{.IMAGE}} {{.DRMON}}/linux

  build:
    desc: Configure + compile + link drmon (SYSTEM=SNES) in the container
    deps: [image]
    cmds:
      - '{{.DOCKER}} bash -euc "cmake -S . -B /build -G Ninja && ninja -C /build"'
      - '{{.DOCKER}} bash -euc "file /build/drmon"'

  run:
    desc: Run drmon in a terminal (needs a TTY ≥ 80×25; runs disconnected, no target)
    deps: [build]
    cmds:
      - docker run --rm -it -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /build -e TERM=xterm-256color -e ASAN_OPTIONS={{.ASAN}} {{.IMAGE}} ./drmon

  debug:
    desc: Run drmon under gdb and print a backtrace (for diagnosing crashes)
    deps: [build]
    cmds:
      - docker run --rm -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /build -e ASAN_OPTIONS={{.ASAN}} {{.IMAGE}} gdb -q -batch -ex run -ex bt ./drmon

  shot:
    desc: Headless screenshot — launch drmon in tmux and dump the rendered TUI as text
    deps: [build]
    cmds:
      - >-
        docker run --rm -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /build -e ASAN_OPTIONS={{.ASAN}} {{.IMAGE}}
        bash -euc '
          export TERM=xterm-256color;
          tmux new-session -d -s d -x 80 -y 25;
          tmux send-keys -t d "./drmon 2>/dev/null" Enter;
          sleep 1.5;
          tmux capture-pane -t d -p;
          tmux kill-server 2>/dev/null || true'

  screenshots:
    desc: Capture a PNG screenshot of every window type into devsys/tools/drmon/docs/img/
    deps: [build]
    cmds:
      - mkdir -p /tmp/drmon-shots {{.ROOT_DIR}}/{{.DRMON}}/docs/img
      - >-
        docker run --rm
        -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -v /tmp/drmon-shots:/shots
        -w /build -e ASAN_OPTIONS={{.ASAN}} {{.IMAGE}}
        bash -euc '
          export TERM=xterm-256color; SESSION=drmon-shots;
          sendalt() { printf "\033%s" "$1" | tmux load-buffer -; tmux paste-buffer -t "$SESSION"; };
          sendraw() { printf "$1"        | tmux load-buffer -; tmux paste-buffer -t "$SESSION"; };
          cap1() { local n="$1" k="$2";
            tmux kill-session -t "$SESSION" 2>/dev/null || true;
            tmux new-session -d -s "$SESSION" -x 80 -y 25;
            tmux send-keys -t "$SESSION" "./drmon 2>/dev/null" Enter; sleep 1.8;
            [ -n "$k" ] && { sendalt "$k"; sleep 0.6; };
            tmux capture-pane -t "$SESSION" -p -e > "/shots/${n}.ansi";
            tmux kill-session -t "$SESSION" 2>/dev/null || true; };
          capmem() { local n="$1" ctrl="$2";
            tmux kill-session -t "$SESSION" 2>/dev/null || true;
            tmux new-session -d -s "$SESSION" -x 80 -y 25;
            tmux send-keys -t "$SESSION" "./drmon 2>/dev/null" Enter; sleep 1.8;
            sendalt m; sleep 0.5;
            sendraw "$ctrl"; sleep 0.3;
            tmux capture-pane -t "$SESSION" -p -e > "/shots/${n}.ansi";
            tmux kill-session -t "$SESSION" 2>/dev/null || true; };
          cap1 desktop  "";
          cap1 memory   m; cap1 register  r; cap1 breakpoint b;
          cap1 watch    w; cap1 symbol    s; cap1 expression e;
          cap1 command  k; cap1 source    l; cap1 textview   t;
          cap1 console  o; cap1 ascii     y;
          cap1 projectinfo i; cap1 about a;
          capmem memory_bytes  "\002";
          capmem memory_words  "\027";
          capmem memory_long   "\014";
          capmem memory_disasm "\004";
          capmem memory_ascii  "\031"'
      - |
        for f in /tmp/drmon-shots/*.ansi; do
          n=$(basename "$f" .ansi)
          python3 {{.ROOT_DIR}}/{{.DRMON}}/linux/render_ansi.py "$f" "{{.ROOT_DIR}}/{{.DRMON}}/docs/img/${n}.png" 2
        done

  smoke:
    desc: Smoke test — open each window via its Alt-key under gdb; fail on any crash (SIGSEGV)
    deps: [build]
    cmds:
      - '{{.DOCKER}} bash linux/smoke-test.sh /build/drmon'

  signals:
    desc: Signal test — Ctrl+C (SIGINT) is ignored; a fatal signal (SIGSEGV) restores the terminal
    deps: [build]
    cmds:
      - '{{.DOCKER}} bash linux/signal-test.sh /build/drmon'

  clean:
    desc: Remove the build tree
    cmds:
      - rm -rf {{.BUILD}}

  rebuild:
    desc: Clean then build from scratch
    cmds:
      - task: clean
      - task: build
