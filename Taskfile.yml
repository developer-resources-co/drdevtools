version: '3'

# drmon Linux port — build/run/debug tasks. Everything runs inside the throwaway
# toolchain container (nothing installed on the host). See
# devsys/tools/drmon/linux/README.md and docs/plans/2026-06-10-port-drmon-linux.md.

vars:
  IMAGE: drmon-build
  DRMON: devsys/tools/drmon
  BUILD: /tmp/drmon-build
  # common container invocation: repo at /src, build tree at /build, cwd = drmon dir
  DOCKER: docker run --rm -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /src/{{.DRMON}} {{.IMAGE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task -l
    silent: true

  image:
    desc: Build the throwaway toolchain Docker image (g++/cmake/ninja/ncurses/gdb/tmux)
    cmds:
      - docker build -t {{.IMAGE}} {{.DRMON}}/linux

  build:
    desc: Configure + compile + link drmon (SYSTEM=SNES) in the container
    deps: [image]
    cmds:
      - '{{.DOCKER}} bash -euc "cmake -S . -B /build -G Ninja && ninja -C /build"'
      - '{{.DOCKER}} bash -euc "file /build/drmon"'

  run:
    desc: Run drmon in a terminal (needs a TTY ≥ 80×25; runs disconnected, no target)
    deps: [build]
    cmds:
      - docker run --rm -it -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /build -e TERM=xterm-256color {{.IMAGE}} ./drmon

  debug:
    desc: Run drmon under gdb and print a backtrace (for diagnosing crashes)
    deps: [build]
    cmds:
      - docker run --rm -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /build {{.IMAGE}} gdb -q -batch -ex run -ex bt ./drmon

  shot:
    desc: Headless screenshot — launch drmon in tmux and dump the rendered TUI as text
    deps: [build]
    cmds:
      - >-
        docker run --rm -v {{.ROOT_DIR}}:/src -v {{.BUILD}}:/build -w /build {{.IMAGE}}
        bash -euc '
          export TERM=xterm-256color;
          tmux new-session -d -s d -x 80 -y 25;
          tmux send-keys -t d "./drmon 2>/dev/null" Enter;
          sleep 1.5;
          tmux capture-pane -t d -p;
          tmux kill-server 2>/dev/null || true'

  clean:
    desc: Remove the build tree
    cmds:
      - rm -rf {{.BUILD}}

  rebuild:
    desc: Clean then build from scratch
    cmds:
      - task: clean
      - task: build
